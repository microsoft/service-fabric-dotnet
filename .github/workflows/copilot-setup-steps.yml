name: Copilot Setup Steps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x
      - run: |
          .\eng\SkipStrongName.ps1
          .\eng\UninstallSfSdkFromGac.ps1
        shell: pwsh # CCA uses Bash on Windows by default
      - run: dotnet restore
